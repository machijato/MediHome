name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build
      
      - run: npx playwright install chromium

      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://medi-home-chi.vercel.app/
