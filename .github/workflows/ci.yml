name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build
      
      - run: npx playwright install chromium

      - name: Start local app
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &

      - name: Wait for local app
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              echo "Local app is ready on http://127.0.0.1:4173"
              exit 0
            fi
            sleep 2
          done
          echo "Local app did not become ready in time" >&2
          exit 1

      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
