name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build
      
      - run: npx playwright install chromium

      - name: Resolve Playwright base URL (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const { owner, repo } = context.repo;

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              sha,
              per_page: 100,
            });

            for (const deployment of deployments) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 100,
              });

              for (const status of statuses) {
                if (status.state !== 'success') continue;
                const rawUrl = status.environment_url || status.target_url;
                if (!rawUrl || !rawUrl.includes('vercel.app')) continue;

                const baseUrl = rawUrl.endsWith('/') ? rawUrl : `${rawUrl}/`;
                core.exportVariable('PLAYWRIGHT_BASE_URL', baseUrl);
                core.info(`Resolved PLAYWRIGHT_BASE_URL=${baseUrl}`);
                return;
              }
            }

            core.setFailed(`Could not resolve a successful vercel.app deployment URL for SHA ${sha}.`);

      - name: Resolve Playwright base URL (main)
        if: github.event_name != 'pull_request'
        run: |
          echo "PLAYWRIGHT_BASE_URL=https://medi-home-chi.vercel.app/" >> "$GITHUB_ENV"

      - run: npx playwright test
