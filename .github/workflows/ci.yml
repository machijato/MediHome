name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Start app locally for Playwright
        run: npm run dev > /tmp/medihome-dev.log 2>&1 &

      - name: Wait for local app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "Local app is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local app failed to start"
          cat /tmp/medihome-dev.log || true
          exit 1

      - name: CI diagnostics before Playwright
        run: |
          echo "=== package.json scripts ==="
          node -e "const pkg=require('./package.json'); console.log(pkg.scripts)"
          echo "=== cwd ==="
          pwd
          echo "=== root file list ==="
          ls -la
          echo "=== first 40 lines from localhost ==="
          curl -fsS http://127.0.0.1:3000 | sed -n '1,40p'
          echo "=== contains React entry script (/src/main.tsx)? ==="
          if curl -fsS http://127.0.0.1:3000 | grep -q '/src/main.tsx'; then
            echo "Found /src/main.tsx entry script in served HTML"
          else
            echo "Did NOT find /src/main.tsx entry script in served HTML"
          fi
          echo "=== dev server log (tail) ==="
          tail -n 80 /tmp/medihome-dev.log || true

      - name: Run Playwright tests against localhost
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
