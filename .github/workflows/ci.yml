name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
      E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Env diagnostics before Vite start
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL set: yes"
          else
            echo "VITE_SUPABASE_URL set: no"
          fi
          if [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY set: yes"
          else
            echo "VITE_SUPABASE_ANON_KEY set: no"
          fi

      - name: Configure DNS for Supabase
        run: |
          sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 8.8.4.4" >> /etc/resolv.conf'
          nslookup supabase.co || true

      - name: Start app locally for Playwright
        run: npm run dev > /tmp/medihome-dev.log 2>&1 &
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Wait for local app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "Local app is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local app failed to start"
          cat /tmp/medihome-dev.log || true
          exit 1

      - name: CI diagnostics before Playwright
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== cat package.json ==="
          cat package.json
          echo "=== cat index.html ==="
          cat index.html
          echo "=== curl localhost head -80 ==="
          curl -s http://127.0.0.1:3000/ | head -80
          echo "=== curl /src/main.tsx head -40 ==="
          curl -s http://127.0.0.1:3000/src/main.tsx | head -40 || true
          echo "=== process / listening port diagnostics ==="
          ps -ef | grep -E 'vite|node' | grep -v grep || true
          ss -ltnp | grep ':3000' || true
          echo "=== dev server log (tail) ==="
          tail -n 80 /tmp/medihome-dev.log || true

      - name: Run Playwright tests against localhost
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
